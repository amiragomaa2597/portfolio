<section class="section studio">
  <div class="section-inner gate">
    <p class="eyebrow">{{ copy().eyebrow }}</p>
    <h2>{{ copy().title }}</h2>
    <p class="prose">{{ copy().lead }}</p>

    <form class="card" (submit)="submit($event)">
      <label>
        <span>{{ copy().password }}</span>
        <input
          type="password"
          name="password"
          autocomplete="current-password"
          [value]="password()"
          (input)="setPassword($event)"
        />
      </label>
      @if (error()) {
        <p class="warn">{{ error() }}</p>
      }
      <button type="submit" class="gold" [disabled]="busy()">{{ copy().unlock }}</button>
    </form>
  </div>
</section>
