<section class="section about" id="about">
  <div class="section-inner split" appReveal>
    <div class="photo-wrap">
      <div class="ring" aria-hidden="true"></div>
      <img src="assets/images/portrait.jpg" [alt]="i18n.t().about.portraitAlt" />
      <div class="badge">.NET · Angular · Flutter</div>
    </div>

    <div class="copy">
      <p class="eyebrow">{{ i18n.t().about.eyebrow }}</p>
      <h2>{{ i18n.t().about.title }}</h2>
      <p class="prose">{{ i18n.t().about.body }}</p>
      <ul class="chips">
        @for (item of socials; track item.icon) {
          <li>
            <a
              [href]="item.href"
              [attr.target]="item.external ? '_blank' : null"
              [attr.rel]="item.external ? 'noopener noreferrer' : null"
            >
              <app-social-icon [name]="item.icon" [label]="item.label" />
              {{ item.label }}
            </a>
          </li>
        }
      </ul>
    </div>
  </div>
</section>
