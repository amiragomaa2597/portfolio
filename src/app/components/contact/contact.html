<section class="section contact" id="contact">
  <div class="section-inner">
    <div class="intro" appReveal>
      <p class="eyebrow">{{ i18n.t().contact.eyebrow }}</p>
      <h2>{{ i18n.t().contact.title }}</h2>
      <p class="prose">{{ i18n.t().contact.lead }}</p>
    </div>

    <div class="grid">
      @for (item of i18n.t().contact.channels; track item.icon; let i = $index) {
        <a
          class="channel"
          [href]="item.href"
          [attr.target]="item.external ? '_blank' : null"
          [attr.rel]="item.external ? 'noopener noreferrer' : null"
          [attr.download]="item.icon === 'cv' ? true : null"
          appReveal
          [appRevealDelay]="i * 60"
        >
          <span class="icon-wrap" aria-hidden="true">
            <app-social-icon [name]="item.icon" [label]="item.label" />
          </span>
          <span class="text">
            <span class="label">{{ item.label }}</span>
            <span class="value">{{ item.value }}</span>
          </span>
        </a>
      }
    </div>
  </div>
</section>
